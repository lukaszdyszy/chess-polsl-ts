version: "3.8"

name: chess_polsl

services:
  chess_polsl_server:
    container_name: chess_polsl_server
    build:
      context: ../server
      target: dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@chess_polsl_postgres:5432/chesspolsl
      - PORT=5000
      - CHOKIDAR_USEPOLLING=true
      - JWT_SECRET=qwerty
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASS=
    depends_on:
      - chess_polsl_postgres
    volumes:
      - ../server:/app
      - /app/node_modules
      - ../chess-logic:/chess-logic
    networks:
      - chess-polsl-network

  chess_polsl_postgres:
    container_name: chess_polsl_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chesspolsl
    ports:
      - "5433:5432"
    volumes:
      - chess_polsl_pgdata:/var/lib/postgresql
    networks:
      - chess-polsl-network

  chess_polsl_pgadmin:
    container_name: chess_polsl_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - chess_polsl_postgres
    volumes:
      - chess_polsl_pgadmin_data:/var/lib/pgadmin
    networks:
      - chess-polsl-network

  chess_polsl_client:
    container_name: chess_polsl_client
    build:
      context: ../client
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../client:/app
      - /app/node_modules
      - ../chess-logic:/chess-logic
    networks:
      - chess-polsl-network

volumes:
  chess_polsl_pgdata:
  chess_polsl_pgadmin_data:

networks:
  chess-polsl-network:
    driver: bridge
